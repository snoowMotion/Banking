name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test BudgetTenable.sln --configuration Release
      - name: Vérifier la syntaxe du frontend
        run: node --check web/app.js && node --check web/sw.js
